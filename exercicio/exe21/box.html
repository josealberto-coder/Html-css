<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelos de caixas</title>

    <style>
        h1 { /*box-level*/
            
            background-color: wheat;
            
            width:200px;
            height: 200px;

            /*border-width: 10px;
            border-style: 10px;
            border-color: blueviolet;*/

            border: 10px solid blue;


           /*padding-top: 10px;
           padding-right: 10px;
           padding-bottom: 10px;
           padding-left: 10px;*/

            padding: 10px 10px 10px 10px;

            margin: 10px auto  20px auto;


            outline: 10px dashed black;
            
        }

        a { /*inline-level*/

            display: inline-block;

            border-width: 5px;
            border-style: solid;
            border-color: aqua;

            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;            
        }




    </style>

</head>
<body>

    <h1>Exemplos de box-level</h1>
    <p>Parágrafos são exemplos de box-level, mas <a href="#">os links são exemplos de inline-level.</a>Observe como tudo isso funciona.
    </p>

    
</body>
</html>
