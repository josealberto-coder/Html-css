<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hover</title>

    <style>
        body {
            font-family: sans-serif;
        }

        div:hover {
            color: blue;
        }

        div > p {
            display: none;
        }

        div:hover > p {
            color: red;
            display:block;
        } 
    </style>

</head>

<body>

    <h1>Exemplo de hover</h1>

    <div>Passe o mouse aqui
        <p>Texto oculto...</p>
    </div>
    
</body>
</html>
